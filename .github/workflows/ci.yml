name: CI

on:
  push:
    branches: [main, dev, perf-test]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
        env:
          # Same public values as the gitignored .env.production (the app id
          # and base URL are already visible in the deployed bundle and in
          # every /api/apps/<id>/... request — not secrets, just kept out of
          # git so each worktree doesn't need one committed). Without them
          # Vite inlines "undefined" and every Base44 call breaks.
          VITE_BASE44_APP_ID: 6a690716a9972b19ca60f096
          VITE_BASE44_APP_BASE_URL: https://vaea.base44.app

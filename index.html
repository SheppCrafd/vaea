<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f5f7f8" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#121212" media="(prefers-color-scheme: dark)" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Above-the-fold fonts, preloaded and declared inline so the prerendered
         marketing headings (Space Grotesk 600) and body (Inter 400) paint in
         their real face on the first frame. The full weight set loads
         separately for the app; these two copies cover the critical path. -->
    <link rel="preload" as="font" type="font/woff2" crossorigin href="/fonts/space-grotesk-latin-600-normal.woff2" />
    <link rel="preload" as="font" type="font/woff2" crossorigin href="/fonts/inter-latin-400-normal.woff2" />
    <style>
      @font-face {
        font-family: "Space Grotesk";
        font-style: normal;
        font-weight: 600;
        font-display: swap;
        src: url("/fonts/space-grotesk-latin-600-normal.woff2") format("woff2");
      }
      @font-face {
        font-family: "Inter";
        font-style: normal;
        font-weight: 400;
        font-display: swap;
        src: url("/fonts/inter-latin-400-normal.woff2") format("woff2");
      }
    </style>

    <!-- Defaults. scripts/prerender.mjs overwrites the tags between the
         PRERENDER markers per route at build time; these values are the
         fallback for any path that isn't prerendered. -->
    <!-- PRERENDER:HEAD:START -->
    <title>Vaea — one calm board for everything you're carrying</title>
    <meta
      name="description"
      content="The calm place to organize every project you're juggling. An assistant does the sorting and shows you first, and your information stays on your own computer."
    />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://vaea.base44.app/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Vaea" />
    <meta property="og:title" content="Vaea — one calm board for everything you're carrying" />
    <meta
      property="og:description"
      content="The calm place to organize every project you're juggling. An assistant does the sorting and shows you first, and your information stays on your own computer."
    />
    <meta property="og:url" content="https://vaea.base44.app/" />
    <meta property="og:image" content="https://vaea.base44.app/og-image.png" />
    <meta property="og:image:alt" content="The Vaea board — projects grouped by the part of life they belong to" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Vaea — one calm board for everything you're carrying" />
    <meta
      name="twitter:description"
      content="The calm place to organize every project you're juggling. An assistant does the sorting and shows you first, and your information stays on your own computer."
    />
    <meta name="twitter:image" content="https://vaea.base44.app/og-image.png" />
    <!-- PRERENDER:HEAD:END -->
  </head>
  <body>
    <!-- PRERENDER:BODY:START --><div id="root"></div><!-- PRERENDER:BODY:END -->
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
